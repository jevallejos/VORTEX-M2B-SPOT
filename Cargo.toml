[package]
name = "vortex-m2b-spot"
version = "1.0.0"
edition = "2021"
rust-version = "1.71"
description = "VORTEX-M2B-SPOT 1h Spot 0x TSMOM Vol-Targeted engine with parallel 4h shadow telemetry"
license = "MIT"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
